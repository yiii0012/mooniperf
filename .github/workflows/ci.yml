name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform independently instead of cancelling the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # moonbitlang/async's Windows C stubs require the MSVC toolchain
      # (event_bus.c errors out under MinGW); point the job at the
      # preinstalled VS build tools, matching the official async repo CI.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Disable auto CRLF (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: ./.github/actions/setup-moonbit

      # Fresh runners have no registry index; moon check/test/build refuse to
      # resolve moonbitlang/async until the index is fetched once.
      - name: Update registry index
        run: moon update

      # The project targets moonc >= 1.0.0-rc1; print the compiler the CI
      # resolved so the requirement is traceable on every run.
      - name: Print toolchain version
        run: moonc -v

      - name: Check
        run: moon check

      - name: Test
        run: moon test

      - name: Build
        run: moon build

      # The native binary is _build/native/debug/build/cmd/main/main(.exe);
      # find it portably and exercise TCP, UDP and -J against itself.
      - name: Loopback smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -File _build |
            Where-Object { $_.FullName -match '[/\\]build[/\\]cmd[/\\]main[/\\]main(\.exe)?$' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { Write-Error 'built CLI not found'; exit 1 }
          Write-Host "binary: $exe"
          $srv = Start-Process -FilePath $exe -ArgumentList '-s','-p','15201' -PassThru
          Start-Sleep -Seconds 2
          & $exe -c 127.0.0.1 -p 15201 -t 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe -c 127.0.0.1 -p 15201 -u -b 2M -t 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe -c 127.0.0.1 -p 15201 -t 2 -J | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Stop-Process -Id $srv.Id -Force

  # Cross-implementation matrix against the reference iperf3, per
  # docs/protocol.md: mooniperf drives a real iperf3 server and vice versa.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-moonbit

      - name: Update registry index
        run: moon update

      - name: Install reference iperf3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iperf3
          iperf3 --version

      - name: Build CLI
        run: moon build

      - name: Cross-implementation interop matrix
        run: |
          exe=$(find _build -type f -path '*build/cmd/main/main*' | head -1)
          if [ -z "$exe" ]; then echo 'built CLI not found'; exit 1; fi
          echo "binary: $exe"
          bash scripts/interop.sh "$exe" "$(command -v iperf3)" 15601
